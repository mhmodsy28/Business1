<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>دفتر الحسابات</title>
<style>
:root{
  --bg:#f2f5fb; --card:#fff; --text:#18203a; --muted:#7c85a0;
  --primary:#4f46e5; --primary-d:#4338ca; --border:#e4e8f2;
  --green:#10b981; --red:#ef4444; --amber:#f59e0b;
  --wa:#25d366; --radius:14px; --shadow:0 2px 12px rgba(24,32,58,.06);
  --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#0f1424; --card:#171d33; --text:#e9edf7; --muted:#8d97b5;
  --border:#242c47; --shadow:0 2px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.hidden{display:none !important}
.muted{color:var(--muted)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{
  font-family:inherit;font-size:16px;width:100%;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:12px;background:var(--card);
  color:var(--text);outline:none;transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 20px;border-radius:12px;font-size:15px;font-weight:600;
  transition:.15s;white-space:nowrap;min-height:46px;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:var(--card);border:1.5px solid var(--border);color:var(--text)}
.btn.danger{background:var(--red);color:#fff}
.btn.success{background:var(--green);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:8px 14px;font-size:13.5px;min-height:36px;border-radius:10px}
.icon-btn{
  width:42px;height:42px;border-radius:11px;display:inline-flex;
  align-items:center;justify-content:center;font-size:16px;transition:.15s;
}
.icon-btn:active{background:var(--bg)}
.link-btn{color:var(--primary);font-size:14px;font-weight:600;padding:8px 0}
.link-btn:hover{text-decoration:underline}

/* ═══ شاشة الدخول ═══ */
.auth{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;
  justify-content:center;padding:20px;
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#2563eb 100%);
}
.auth-card{
  background:var(--card);width:100%;max-width:420px;border-radius:22px;
  padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.auth-brand{
  width:62px;height:62px;margin:0 auto 14px;border-radius:18px;font-size:30px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
}
.auth-card h1{font-size:21px;margin-bottom:6px;text-align:center}
.auth-card>p{font-size:13.5px;text-align:center;margin-bottom:22px;color:var(--muted)}
.tabs{display:flex;background:var(--bg);border-radius:11px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:11px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);transition:.15s}
.tab.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.auth-form .btn{margin-top:22px}

/* ═══ التطبيق ═══ */
#appScreen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;position:sticky;top:0;z-index:40;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar h2{font-size:17px;font-weight:700}
.topbar p{font-size:12px;color:var(--muted);margin-top:2px}
.burger{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:20px;background:var(--bg);
}
.top-actions{display:flex;gap:6px}

.main{
  flex:1;padding:14px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  max-width:1100px;width:100%;margin:0 auto;
}

/* ═══ شريط التنقل السفلي ═══ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);z-index:45;
  display:flex;justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;
  padding:8px 2px;transition:.15s;
}
.bnav-item .ic{font-size:21px;line-height:1}
.bnav-item.active{color:var(--primary)}

/* ═══ القائمة الجانبية (سطح المكتب فقط) ═══ */
@media(min-width:900px){
  #appScreen{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .bottom-nav{display:none}
  .main{padding:20px 22px 22px;grid-column:2}
  .topbar{grid-column:2;padding-top:14px}
  .burger{display:none}
  .sidebar-desktop{
    grid-row:1/3;background:var(--card);border-left:1px solid var(--border);
    padding:18px 12px;display:flex;flex-direction:column;gap:3px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;
    border-bottom:1px solid var(--border);margin-bottom:12px}
  .side-brand .ic{width:38px;height:38px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-size:19px;color:#fff;
    background:linear-gradient(135deg,#4f46e5,#7c3aed)}
  .side-brand b{font-size:14px;display:block}
  .side-brand small{font-size:11px;color:var(--muted)}
  .side-nav{display:flex;flex-direction:column;gap:3px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;
    border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);
    transition:.15s;width:100%;text-align:right;
  }
  .nav-item:hover{background:var(--bg);color:var(--text)}
  .nav-item.active{background:var(--primary);color:#fff}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
}
@media(max-width:899px){
  .sidebar-desktop{display:none}
}

/* ═══ البطاقات ═══ */
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{
  background:var(--card);border-radius:var(--radius);padding:16px;
  border:1px solid var(--border);position:relative;overflow:hidden;
}
.stat::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;
  width:4px;background:var(--primary)}
.stat.g::before{background:var(--green)}
.stat.r::before{background:var(--red)}
.stat.a::before{background:var(--amber)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat .val{font-size:20px;font-weight:800;letter-spacing:-.3px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:4px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:15px}
.card-body{padding:16px}

/* ═══ الجداول ═══ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:100%}
th{text-align:right;padding:11px 14px;font-size:11.5px;color:var(--muted);
  font-weight:700;background:var(--bg);white-space:nowrap}
td{padding:13px 14px;border-top:1px solid var(--border);vertical-align:middle}
.amount{font-weight:700;white-space:nowrap}
.amount.pos{color:var(--red)} .amount.neg{color:var(--green)}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.debt,.pill.exp{background:rgba(239,68,68,.12);color:var(--red)}
.pill.pay,.pill.inc{background:rgba(16,185,129,.12);color:var(--green)}
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty .e-ico{font-size:38px;display:block;margin-bottom:10px;opacity:.5}
.avatar{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;
}
.cell-user{display:flex;align-items:center;gap:10px;min-width:0}
.cell-user b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-user small{color:var(--muted);font-size:11.5px}
.actions{display:flex;gap:2px;justify-content:flex-end}
.actions .icon-btn{width:36px;height:36px;font-size:14px}
.search{
  display:flex;align-items:center;gap:6px;background:var(--bg);
  border-radius:11px;padding:0 12px;min-width:180px;flex:1;
}
.search input{border:none;background:none;padding:11px 0;box-shadow:none;font-size:15px}
.search input:focus{box-shadow:none}

/* ═══ النوافذ (Modals) ═══ */
.overlay{
  position:fixed;inset:0;background:rgba(15,20,36,.55);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s;
}
@media(min-width:600px){
  .overlay{align-items:center;padding:20px}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);width:100%;max-width:520px;
  max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;animation:up .25s;
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:600px){
  .modal{border-radius:18px;max-height:90vh;animation:pop .2s}
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal-head{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  position:sticky;top:0;background:var(--card);z-index:1;
  border-radius:22px 22px 0 0;
}
@media(min-width:600px){.modal-head{border-radius:18px 18px 0 0}}
.modal-head h3{font-size:16px}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{
  display:flex;gap:10px;margin-top:20px;padding-top:14px;
  border-top:1px solid var(--border);
}
.modal-foot .btn{flex:1}

/* ═══ بنود الفاتورة (مواد) ═══ */
.line{display:grid;grid-template-columns:1fr 70px 90px 38px;gap:6px;align-items:center;margin-bottom:8px}
.line input,.line select{padding:10px;font-size:14px;border-radius:10px}
.line .icon-btn{width:38px;height:38px}

/* ═══ خطط الاشتراك ═══ */
.plans{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:560px){.plans{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.plans{grid-template-columns:repeat(4,1fr)}}
.plan{
  background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
  padding:20px 16px;text-align:center;position:relative;
}
.plan.best{border-color:var(--primary)}
.plan .tag{
  position:absolute;top:-10px;inset-inline-start:50%;transform:translateX(50%);
  background:var(--primary);color:#fff;font-size:11px;font-weight:700;
  padding:3px 12px;border-radius:20px;white-space:nowrap;
}
.plan h4{font-size:16px;margin-bottom:10px}
.plan .price{font-size:28px;font-weight:800;color:var(--primary);letter-spacing:-1px}
.plan .price small{font-size:12px;font-weight:600;color:var(--muted)}
.plan .save{display:inline-block;background:rgba(16,185,129,.13);color:var(--green);
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px}
.plan ul{list-style:none;margin:14px 0;font-size:13px;color:var(--muted);text-align:right}
.plan ul li{padding:5px 0;padding-inline-start:20px;position:relative}
.plan ul li::before{content:"✓";position:absolute;inset-inline-start:0;
  color:var(--green);font-weight:800}
.plan .btn{width:100%;margin-top:4px}

.wa-box{
  background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;
  padding:20px 18px;border-radius:16px;text-align:center;margin-bottom:18px;
}
.wa-box h3{font-size:16px;margin-bottom:6px}
.wa-box p{font-size:13px;opacity:.95;margin-bottom:12px}
.wa-box .num{
  font-size:24px;font-weight:800;letter-spacing:2px;direction:ltr;
  display:inline-block;margin-bottom:14px;
  background:rgba(255,255,255,.18);padding:6px 16px;border-radius:12px;
}
.wa-box .btn{background:#fff;color:#128c7e;font-weight:700}

/* ═══ التنبيهات ═══ */
#toasts{position:fixed;top:14px;inset-inline-start:14px;inset-inline-end:14px;
  z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
@media(min-width:600px){#toasts{inset-inline-end:auto;max-width:340px;top:20px}}
.toast{
  background:var(--card);border:1px solid var(--border);
  border-inline-start:4px solid var(--green);padding:13px 16px;
  border-radius:12px;font-size:14px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.14);animation:slide .25s;
}
.toast.err{border-inline-start-color:var(--red)}
@keyframes slide{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}

/* ═══ شاشة القفل ═══ */
.lock{position:fixed;inset:0;background:var(--bg);z-index:300;
  overflow-y:auto;padding:24px 16px;
  padding-top:calc(24px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.lock-inner{max-width:900px;margin:0 auto}
.lock-head{text-align:center;margin-bottom:24px}
.lock-head .ic{font-size:52px;display:block;margin-bottom:10px}
.lock-head h2{font-size:22px;margin-bottom:6px}

/* ═══ شاشة الأدمن ═══ */
.admin-header{
  background:linear-gradient(135deg,#1e1b4b,#4f46e5);
  color:#fff;padding:20px 18px;border-radius:16px;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;
}
.admin-header .ic{font-size:36px}
.admin-header h2{font-size:18px}
.admin-header p{font-size:13px;opacity:.85;margin-top:2px}

.code-chip{
  display:inline-block;background:var(--bg);border:1.5px dashed var(--border);
  padding:6px 12px;border-radius:8px;font-family:monospace;
  font-size:13.5px;font-weight:700;direction:ltr;letter-spacing:1px;
}
.code-used{opacity:.5;text-decoration:line-through}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px}
.filter-bar .btn.sm{padding:7px 13px;font-size:12.5px;min-height:34px;white-space:nowrap}

.row-between{display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.row-between span{font-size:13px;font-weight:700;color:var(--muted)}

.banner{
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);
  color:var(--amber);padding:12px 16px;border-radius:12px;font-size:13px;
  font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;
}

/* نقاط استجابة عامة */
@media(max-width:400px){
  .stat .val{font-size:18px}
  .stat{padding:14px}
  .bnav-item{font-size:10px}
  .bnav-item .ic{font-size:19px}
}
</style>
</head>
<body>

<!-- ═══════════ شاشة تسجيل الدخول للمستخدمين ═══════════ -->
<div id="authScreen" class="auth hidden">
  <div class="auth-card">
    <div class="auth-brand">📒</div>
    <h1>دفتر الحسابات</h1>
    <p>إدارة الديون والعملاء والمواد والأرباح</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">تسجيل الدخول</button>
      <button class="tab" data-tab="register">إنشاء حساب</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>رقم الهاتف</label>
      <input id="loginPhone" type="tel" placeholder="05xxxxxxxx" autocomplete="username" inputmode="tel">
      <label>كلمة المرور</label>
      <input id="loginPass" type="password" placeholder="••••••" autocomplete="current-password">
      <button class="btn primary full" type="submit">دخول</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <label>الاسم الكامل</label>
      <input id="regName" type="text" placeholder="محمد أحمد" autocomplete="name">
      <label>رقم الهاتف</label>
      <input id="regPhone" type="tel" placeholder="05xxxxxxxx" autocomplete="username" inputmode="tel">
      <label>كلمة المرور</label>
      <input id="regPass" type="password" placeholder="4 أحرف على الأقل" autocomplete="new-password">
      <label>تأكيد كلمة المرور</label>
      <input id="regPass2" type="password" placeholder="••••••" autocomplete="new-password">
      <button class="btn primary full" type="submit">إنشاء الحساب</button>
      <p class="muted" style="font-size:12.5px;text-align:center;margin-top:14px;line-height:1.6">
        تحصل على تجربة مجانية 3 أيام<br>
        للاشتراك: واتساب 0992320306
      </p>
    </form>
  </div>
</div>

<!-- ═══════════ شاشة الأدمن (رابط مخفي #/admin) ═══════════ -->
<div id="adminLoginScreen" class="auth hidden">
  <div class="auth-card">
    <div class="auth-brand" style="background:linear-gradient(135deg,#1e1b4b,#dc2626)">🛡️</div>
    <h1>لوحة المدير</h1>
    <p>دخول خاص للمسؤول فقط</p>

    <form id="adminLoginForm" class="auth-form">
      <label>اسم المستخدم</label>
      <input id="admUser" type="text" placeholder="admin" autocomplete="username" value="admin">
      <label>كلمة المرور</label>
      <input id="admPass" type="password" placeholder="••••••" autocomplete="current-password">
      <button class="btn primary full" type="submit">دخول</button>
    </form>

    <div style="text-align:center;margin-top:18px">
      <button class="link-btn" onclick="location.hash='#/'">← رجوع لصفحة المستخدمين</button>
    </div>
  </div>
</div>

<!-- ═══════════ التطبيق الرئيسي ═══════════ -->
<div id="appScreen" class="hidden">
  <!-- قائمة سطح المكتب -->
  <aside class="sidebar-desktop">
    <div class="side-brand">
      <div class="ic">📒</div>
      <div>
        <b id="sideName">—</b>
        <small id="sidePhone">—</small>
      </div>
    </div>
    <nav class="side-nav">
      <button class="nav-item active" data-view="dashboard">📊 لوحة التحكم</button>
      <button class="nav-item" data-view="customers">👥 العملاء</button>
      <button class="nav-item" data-view="transactions">💳 الحركات</button>
      <button class="nav-item" data-view="ledger">💹 الأرباح والخسائر</button>
      <button class="nav-item" data-view="items">📦 المواد</button>
      <button class="nav-item" data-view="subscription">⭐ الاشتراك</button>
      <button class="nav-item" data-view="settings">⚙️ الإعدادات</button>
    </nav>
    <div class="side-foot">
      <div id="sideSub" class="muted" style="font-size:12px;padding:10px;line-height:1.6"></div>
      <button class="btn ghost full sm" id="themeBtn" style="margin-bottom:6px">🌙 الوضع الليلي</button>
      <button class="btn ghost full sm" id="logoutBtn">🚪 خروج</button>
    </div>
  </aside>

  <!-- الشريط العلوي -->
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <div>
        <h2 id="pageTitle">لوحة التحكم</h2>
        <p id="pageSub">نظرة عامة</p>
      </div>
    </div>
    <div class="top-actions" id="topActions"></div>
  </header>

  <!-- المحتوى -->
  <main class="main">
    <div id="viewRoot"></div>

<script>

  m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
  return (h >>> 0).toString(16);
}
function fmtDate(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
}
const todayISO = () => new Date().toISOString().slice(0, 10);
const cur = () => (state.data?.settings?.currency) || 'ر.س';
function money(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + cur();
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('');
}
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; }, 2400);
  setTimeout(() => el.remove(), 2800);
}

/* ═══════════════════════════════════════════════════════
   التخزين

  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
  del(k)    { localStorage.removeItem(k); }

/* ═══════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════
   الاشتراك
   ═══════════════════════════════════════════════════════ */
function subInfo(u) {
  const s = u.subscription || {};
  const end = new Date(s.endDate || 0).getTime();
  const now = Date.now();
  const left = Math.ceil((end - now) / DAY);
  return {
    plan: s.plan || 'trial',
    endDate: s.endDate,
    active: end > now,
    daysLeft: Math.max(0, left),
    planName: s.plan === 'trial' ? 'تجربة مجانية' : planById(s.plan).name
  };
}
function extendSubscription(userId, planId, days) {
  const users = STORE.get(K.users, []);
  const u = users.find(x => x.id === userId);
  if (!u) return;
  const now = Date.now();
  const curEnd = new Date(u.subscription?.endDate || 0).getTime();
  const base = curEnd > now ? curEnd : now;
  u.subscription = {
    plan: planId,
    startDate: now,
    endDate: base + days * DAY,
    history: [...(u.subscription?.history || []), { plan: planId, days, at: now }]
  };
  STORE.set(K.users, users);
  if (state.user && state.user.id === userId) state.user = u;
}

/* ═══════════════════════════════════════════════════════
   تهيئة
   ═══════════════════════════════════════════════════════ */
function initSeed() {
  if (!STORE.get(K.users)) STORE.set(K.users, []);
  if (!STORE.get(K.codes) || STORE.get(K.codes).length === 0) {
    const now = Date.now();
    STORE.set(K.codes, PRESET_CODES.map((code, i) => {
      const plan = planFromCode(code);
      return { code, plan, days: planById(plan).days, used: false, createdAt: now - i * 1000 };
    }));
  }
}

document.documentElement.dataset.theme = savedTheme;

/* ═══════════════════════════════════════════════════════
   التنقل بين الشاشات
   ═══════════════════════════════════════════════════════ */
function hideAll() {
  ['authScreen','adminLoginScreen','appScreen','lockScreen','adminScreen']
    .forEach(id => $('#' + id).classList.add('hidden'));
}

function route() {
  initSeed();
  const hash = (location.hash || '#/').toLowerCase();

  /* مسار الأدمن */
  if (hash === '#/admin') {
    if (STORE.get(K.admin, false)) {
      hideAll();
      $('#adminScreen').classList.remove('hidden');
      renderAdmin();
    } else {
      hideAll();
      $('#adminLoginScreen').classList.remove('hidden');
    }
    return;
  }

  /* مسار المستخدم */
  const sess = STORE.get(K.session);
  if (!sess) {
    hideAll();
    $('#authScreen').classList.remove('hidden');
    return;
  }
  const users = STORE.get(K.users, []);
  const u = users.find(x => x.id === sess.id);
  if (!u) { STORE.del(K.session); return route(); }

  state.user = u;
  state.data = STORE.get(K.data(u.id),
    { customers: [], transactions: [], ledger: [], items: [], settings: { currency: 'ر.س' } });
  state.data.settings = state.data.settings || { currency: 'ر.س' };
  if (!state.data.ledger) state.data.ledger = [];

  hideAll();
  const si = subInfo(u);
  if (!si.active) {
    $('#lockScreen').classList.remove('hidden');
    renderLock();
  } else {
    $('#appScreen').classList.remove('hidden');
    updateSidebar();
    renderView();
    updateThemeBtn();
  }
}
window.addEventListener('hashchange', route);

   نموذج التسجيل / الدخول

  $$('.tab').forEach(x => x.classList.remove('active'));

$('#registerForm').addEventListener('submit', e => {
  e.preventDefault();
  const name  = $('#regName').value.trim();
  const phone = $('#regPhone').value.trim();
  const pass  = $('#regPass').value;
  const pass2 = $('#regPass2').value;

  if (name.length < 2)                   return toast('الاسم قصير جداً', 'err');
  if (!/^[0-9+\-\s]{6,15}$/.test(phone)) return toast('رقم الهاتف غير صالح', 'err');
  if (pass.length < 4)                   return toast('كلمة المرور 4 أحرف على الأقل', 'err');
  if (pass !== pass2)                    return toast('كلمتا المرور غير متطابقتين', 'err');

  const users = STORE.get(K.users, []);
  if (users.some(u => u.phone === phone)) return toast('الرقم مسجّل مسبقاً', 'err');

  const now = Date.now();
  const user = {
    id: uid(), name, phone,
    pass: hash(pass + 'ldg'),
    createdAt: now,
    subscription: { plan: 'trial', startDate: now, endDate: now + 3 * DAY, history: [] }
  };
  users.push(user);
  STORE.set(K.users, users);
  STORE.set(K.data(user.id), { customers: [], transactions: [], ledger: [], items: [], settings: { currency: 'ر.س' } });
  STORE.set(K.session, { id: user.id });
  toast('تم إنشاء الحساب 🎉');

/* ═══════════════════════════════════════════════════════
   عرض الواجهات
   ═══════════════════════════════════════════════════════ */
const TITLES = {
  dashboard:    ['لوحة التحكم', 'نظرة عامة على حساباتك'],
  customers:    ['العملاء', 'إدارة العملاء وأرصدتهم'],
  transactions: ['الحركات', 'كل الديون والدفعات'],
  ledger:       ['الأرباح والخسائر', 'الإيرادات والمصروفات اليومية'],
  items:        ['المواد', 'قائمة المواد والأسعار'],
  subscription: ['الاشتراك', 'إدارة خطة اشتراكك'],
  settings:     ['الإعدادات', 'بيانات الحساب والتفضيلات']
};

function renderView() {
  const [t, s] = TITLES[state.view] || ['', ''];
  $('#pageTitle').textContent = t;
  $('#pageSub').textContent = s;
  $('#topActions').innerHTML = '';
  $('#viewRoot').innerHTML = '';
  ({
    dashboard: renderDashboard, customers: renderCustomers,
    transactions: renderTransactions, ledger: renderLedger,
    items: renderItems, subscription: renderSubscription,
    settings: renderSettings
  }[state.view] || renderDashboard)();
}

function saveData() { STORE.set(K.data(state.user.id), state.data); }
function customerById(id) { return state.data.customers.find(c => c.id === id); }
function balanceOf(cid) {
  return state.data.transactions.filter(t => t.customerId === cid)
    .reduce((s, t) => s + (t.type === 'debt' ? t.amount : -t.amount), 0);
}
function totals() {
  const tx = state.data.transactions;
  const debt = tx.filter(t => t.type === 'debt').reduce((s, t) => s + t.amount, 0);
  const paid = tx.filter(t => t.type === 'payment').reduce((s, t) => s + t.amount, 0);
  return { debt, paid, remain: debt - paid };
}
function ledgerStats(entries) {
  const inc = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const exp = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  return { inc, exp, net: inc - exp };
}
function isToday(ts) {
  const d = new Date(ts), n = new Date();
  return d.getDate() === n.getDate() && d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}

/* ─── لوحة التحكم ─── */
function renderDashboard() {
  const { debt, paid, remain } = totals();
  const customers = state.data.customers;
  const todayStats = ledgerStats((state.data.ledger || []).filter(e => isToday(e.date)));

  $('#topActions').innerHTML = `
    <button class="btn primary sm" onclick="openTxModal('debt')">+ دين</button>
    <button class="btn success sm" onclick="openTxModal('payment')">دفعة</button>`;

  const debtors = customers.map(c => ({ ...c, bal: balanceOf(c.id) }))
    .filter(c => c.bal > 0.001).sort((a, b) => b.bal - a.bal).slice(0, 5);
  const recent = [...state.data.transactions].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);

  const netColor = todayStats.net > 0 ? 'var(--green)' : todayStats.net < 0 ? 'var(--red)' : 'var(--muted)';
  const netLabel = todayStats.net > 0 ? 'ربح اليوم' : todayStats.net < 0 ? 'خسارة اليوم' : 'لا ربح ولا خسارة';

  $('#viewRoot').innerHTML = `
    <div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;color:#fff">
      <div class="card-body">
        <div style="font-size:12px;opacity:.8;margin-bottom:6px">${netLabel} — ${fmtDate(Date.now())}</div>
        <div style="font-size:28px;font-weight:800;letter-spacing:-.5px;color:#fff">${money(Math.abs(todayStats.net))}</div>
        <div style="display:flex;gap:16px;margin-top:12px;font-size:12px;opacity:.9">
          <span>إيرادات: ${money(todayStats.inc)}</span>
          <span>مصروفات: ${money(todayStats.exp)}</span>
        </div>
      </div>
    </div>

    <div class="grid stats" style="margin-bottom:14px">
      <div class="stat r">
        <div class="lbl">إجمالي الديون</div>
        <div class="val">${money(debt)}</div>
      </div>
      <div class="stat g">

/* ─── العملاء ─── */
let custQuery = '';
function renderCustomers() {
  $('#topActions').innerHTML = `<button class="btn primary sm" onclick="openCustomerModal()">+ عميل</button>`;
  const q = custQuery.toLowerCase();
  const list = state.data.customers.map(c => ({ ...c, bal: balanceOf(c.id) }))
    .filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q))
    .sort((a, b) => b.bal - a.bal);

  $('#viewRoot').innerHTML = `
    <div class="search" style="margin-bottom:12px">
      <span class="muted">🔍</span>
      <input id="custSearch" placeholder="ابحث بالاسم أو الهاتف..." value="${esc(custQuery)}">
    </div>
    <div class="card">
      <div class="table-wrap">
        ${list.length ? `<table>
          <thead><tr><th>العميل</th><th>الرصيد</th><th></th></tr></thead>
          <tbody>
            ${list.map(c => {
              const bc = c.bal > 0.001 ? 'pos' : (c.bal < -0.001 ? 'neg' : '');
              const tag = c.bal > 0.001 ? 'عليه' : (c.bal < -0.001 ? 'له' : '');
              return `<tr>
                <td><div class="cell-user">
                  <div class="avatar">${esc(initials(c.name))}</div>
                  <div style="min-width:0">
                    <b>${esc(c.name)}</b>
                    <small>${esc(c.phone || 'بدون رقم')}</small>
                  </div>
                </div></td>
                <td class="amount ${bc}">${money(Math.abs(c.bal))}<br>
                  <small class="muted" style="font-weight:400;font-size:11px">${tag}</small>
                </td>
                <td>
                  <div class="actions">
                    <button class="icon-btn" onclick="openStatement('${c.id}')" title="كشف">📄</button>
                    <button class="icon-btn" onclick="openCustomerModal('${c.id}')" title="تعديل">✏️</button>
                    <button class="icon-btn" onclick="deleteCustomer('${c.id}')" title="حذف">🗑️</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody></table>` : `<div class="empty">
            <span class="e-ico">👥</span>لا يوجد عملاء
            <br><br>
            <button class="btn primary sm" onclick="openCustomerModal()">إضافة أول عميل</button>
          </div>`}
      </div>
    </div>`;

  const inp = $('#custSearch');
  if (inp) {
    let t;
    inp.addEventListener('input', e => {
      clearTimeout(t);
      const v = e.target.value;
      t = setTimeout(() => {
        custQuery = v;
        renderCustomers();
        const ni = $('#custSearch'); if (ni) { ni.focus(); ni.setSelectionRange(v.length, v.length); }
      }, 220);
    });
  }
}

function openCustomerModal(id) {
  const c = id ? customerById(id) : null;
  openModal({
    title: c ? 'تعديل عميل' : 'عميل جديد',
    body: `
      <label>الاسم *</label>
      <input id="cName" value="${esc(c?.name || '')}" placeholder="اسم العميل">
      <label>رقم الهاتف</label>
      <input id="cPhone" type="tel" value="${esc(c?.phone || '')}" placeholder="05xxxxxxxx" inputmode="tel">
      <label>ملاحظات</label>
      <textarea id="cNote" rows="2" placeholder="اختياري...">${esc(c?.note || '')}</textarea>`,
    onSubmit: form => {
      const name = $('#cName', form).value.trim();
      if (name.length < 2) { toast('الاسم قصير', 'err'); return false; }
      if (c) {
        Object.assign(c, { name, phone: $('#cPhone', form).value.trim(), note: $('#cNote', form).value.trim() });
        toast('تم التحديث');
      } else {
        state.data.customers.push({
          id: uid(), name,
          phone: $('#cPhone', form).value.trim(),
          note: $('#cNote', form).value.trim(),
          createdAt: Date.now()
        });
        toast('تمت الإضافة');
      }
      saveData(); renderCustomers();
    }
  });
}

function deleteCustomer(id) {
  const c = customerById(id);
  if (!c) return;
  const n = state.data.transactions.filter(t => t.customerId === id).length;
  openModal({
    title: 'تأكيد الحذف',
    body: `<p style="line-height:1.8">حذف العميل <b>${esc(c.name)}</b>؟<br>
      سيتم حذف <b>${n}</b> حركة مرتبطة. لا يمكن التراجع.</p>`,
    submitText: 'حذف', danger: true,
    onSubmit: () => {
      state.data.customers = state.data.customers.filter(x => x.id !== id);
      state.data.transactions = state.data.transactions.filter(t => t.customerId !== id);
      saveData(); renderCustomers(); toast('تم الحذف', 'err');
    }
  });
}

function openStatement(id) {
  const c = customerById(id);
  if (!c) return;
  const tx = state.data.transactions.filter(t => t.customerId === id)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  let running = 0;
  const rows = tx.map(t => {
    running += t.type === 'debt' ? t.amount : -t.amount;
    return `<tr>
      <td style="white-space:nowrap">${fmtDate(t.date)}</td>
      <td><span class="pill ${t.type}">${t.type === 'debt' ? 'دين' : 'دفعة'}</span></td>
      <td class="amount ${t.type === 'debt' ? 'pos' : 'neg'}">${t.type === 'debt' ? '+' : '−'}${money(t.amount)}</td>
      <td class="amount">${money(running)}</td>
    </tr>`;
  }).join('');

  openModal({
    title: 'كشف — ' + c.name,
    wide: true,
    body: `
      <div class="grid stats" style="margin-bottom:14px">
        <div class="stat ${running > 0 ? 'r' : 'g'}">
          <div class="lbl">الرصيد الحالي</div>
          <div class="val">${money(Math.abs(running))}</div>
          <div class="sub">${running > 0 ? 'عليه' : running < 0 ? 'له' : 'مسدَّد'}</div>
        </div>
        <div class="stat">
          <div class="lbl">عدد الحركات</div>
          <div class="val">${tx.length}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button type="button" class="btn primary sm" style="flex:1" onclick="closeAllModals();openTxModal('debt','${c.id}')">+ دين</button>
        <button type="button" class="btn success sm" style="flex:1" onclick="closeAllModals();openTxModal('payment','${c.id}')">دفعة</button>
      </div>
      <div class="table-wrap" style="border:1px solid var(--border);border-radius:12px;overflow:hidden">
        ${tx.length ? `<table><thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الرصيد</th></tr></thead>
          <tbody>${rows}</tbody></table>`
          : `<div class="empty"><span class="e-ico">📭</span>لا حركات</div>`}
      </div>`,
    submitText: 'إغلاق',
    onSubmit: () => {}
  });
}

/* ─── الحركات ─── */

function renderTransactions() {
  $('#topActions').innerHTML = `
    <button class="btn primary sm" onclick="openTxModal('debt')">+ دين</button>
    <button class="btn success sm" onclick="openTxModal('payment')">دفعة</button>`;

  let tx = [...state.data.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
  if (txFilter !== 'all') tx = tx.filter(t => t.type === txFilter);

  $('#viewRoot').innerHTML = `
    <div class="filter-bar" style="margin-bottom:12px">
      ${[['all','الكل'],['debt','ديون'],['payment','دفعات']].map(([k, l]) =>
        `<button class="btn sm ${txFilter === k ? 'primary' : 'ghost'}" onclick="txFilter='${k}';renderTransactions()">${l}</button>`
      ).join('')}
    </div>
    <div class="card">
      <div class="table-wrap">
        ${tx.length ? `<table>
          <thead><tr><th>التاريخ</th><th>العميل</th><th>النوع</th><th>المبلغ</th><th></th></tr></thead>
          <tbody>
            ${tx.map(t => {
              const c = customerById(t.customerId);
              return `<tr>
                <td style="white-space:nowrap;font-size:12px">${fmtDate(t.date)}</td>

                <td><span class="pill ${t.type}">${t.type === 'debt' ? 'دين' : 'دفعة'}</span></td>
                <td class="amount ${t.type === 'debt' ? 'pos' : 'neg'}">${t.type === 'debt' ? '+' : '−'}${money(t.amount)}</td>
                <td><div class="actions">
                  <button class="icon-btn" onclick="deleteTx('${t.id}')">🗑️</button>
                </div></td>
              </tr>`;
            }).join('')}
          </tbody></table>` : `<div class="empty"><span class="e-ico">📭</span>لا حركات</div>`}

    </div>`;
}

function deleteTx(id) {
  openModal({
    title: 'حذف الحركة',
    body: '<p>هل تريد حذف هذه الحركة؟</p>',
    submitText: 'حذف', danger: true,
    onSubmit: () => {
      const t = state.data.transactions.find(x => x.id === id);
      if (t?.items?.length) t.items.forEach(it => {
        const item = state.data.items.find(i => i.id === it.itemId);
        if (item) item.stock = (Number(item.stock) || 0) + Number(it.qty);
      });
      state.data.transactions = state.data.transactions.filter(x => x.id !== id);
      saveData(); renderTransactions(); toast('تم الحذف', 'err');
    }
  });
}

function openTxModal(type, customerId) {
  if (!state.data.customers.length) {
    toast('أضف عميلاً أولاً', 'err');
    return openCustomerModal();
  }
  const isDebt = type === 'debt';
  const custOpts = state.data.customers
    .map(c => `<option value="${c.id}" ${c.id === customerId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const itemOpts = state.data.items
    .map(i => `<option value="${i.id}" data-price="${i.price}">${esc(i.name)}</option>`).join('');

  openModal({
    title: isDebt ? 'تسجيل دين' : 'تسجيل دفعة',
    wide: isDebt,
    body: `
      <label>العميل *</label>
      <select id="txCustomer">${custOpts}</select>
      <label>التاريخ</label>
      <input type="date" id="txDate" value="${todayISO()}">
      ${isDebt ? `
      <div class="row-between">
        <span>المواد (اختياري)</span>
        <button type="button" class="btn ghost sm" id="addLineBtn" ${state.data.items.length ? '' : 'disabled'}>+ إضافة</button>
      </div>
      ${!state.data.items.length ? '<p class="muted" style="font-size:12px;margin-bottom:8px">لا توجد مواد في المخزون</p>' : ''}
      <div id="lines"></div>` : ''}
      <label>المبلغ * (${cur()})</label>
      <input type="number" id="txAmount" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
      <label>البيان / ملاحظة</label>
      <input id="txNote" placeholder="${isDebt ? 'بضاعة متنوعة' : 'دفعة نقدية'}">`,
    submitText: isDebt ? 'حفظ الدين' : 'حفظ الدفعة',
    onSubmit: form => {
      const amount = parseFloat($('#txAmount', form).value);
      if (!amount || amount <= 0) { toast('أدخل مبلغاً صحيحاً', 'err'); return false; }
      const items = [];
      $$('[data-line]', form).forEach(line => {
        const sel = $('[data-item]', line);
        const qty = parseFloat($('[data-qty]', line).value) || 0;
        const price = parseFloat($('[data-price]', line).value) || 0;
        if (qty > 0) {
          const item = state.data.items.find(i => i.id === sel.value);
          items.push({ itemId: sel.value, name: item?.name || '', qty, price, unit: item?.unit || '' });
          if (item) item.stock = (Number(item.stock) || 0) - qty;
        }
      });
      state.data.transactions.push({
        id: uid(),
        customerId: $('#txCustomer', form).value,
        type, amount,
        date: new Date($('#txDate', form).value || todayISO()).getTime(),
        note: $('#txNote', form).value.trim(),
        items, createdAt: Date.now()
      });
      saveData();
      toast(isDebt ? 'تم تسجيل الدين' : 'تم تسجيل الدفعة');
      renderView();
    },
    onMount: form => {
      if (!isDebt) return;
      const linesEl = $('#lines', form);
      const recalc = () => {
        let total = 0;
        $$('[data-line]', form).forEach(l => {
          const q = parseFloat($('[data-qty]', l).value) || 0;
          const p = parseFloat($('[data-price]', l).value) || 0;
          total += q * p;
        });
        if (total > 0) $('#txAmount', form).value = total.toFixed(2);
      };
      const addLine = () => {
        const div = document.createElement('div');
        div.className = 'line';
        div.setAttribute('data-line', '');
        div.innerHTML = `
          <select data-item>${itemOpts}</select>
          <input type="number" data-qty value="1" min="0" inputmode="decimal" placeholder="كمية">
          <input type="number" data-price value="${state.data.items[0]?.price || 0}" min="0" inputmode="decimal" placeholder="سعر">
          <button type="button" class="icon-btn" data-remove>×</button>`;
        linesEl.appendChild(div);
        const sel = $('[data-item]', div), qtyI = $('[data-qty]', div), prI = $('[data-price]', div);
        sel.addEventListener('change', () => { prI.value = sel.selectedOptions[0]?.dataset.price || 0; recalc(); });
        qtyI.addEventListener('input', recalc);
        prI.addEventListener('input', recalc);
        $('[data-remove]', div).addEventListener('click', () => { div.remove(); recalc(); });
        recalc();
      };
      const btn = $('#addLineBtn', form);
      if (btn) btn.addEventListener('click', addLine);
    }
  });
}

/* ─── الأرباح والخسائر ─── */
let ledgerFilter = 'today';
function renderLedger() {
  $('#topActions').innerHTML = `
    <button class="btn success sm" onclick="openLedgerModal('income')">+ إيراد</button>
    <button class="btn danger sm" onclick="openLedgerModal('expense')">- مصروف</button>`;

  const all = state.data.ledger || [];
  const now = Date.now();
  let filtered = all;
  if (ledgerFilter === 'today') filtered = all.filter(e => isToday(e.date));
  else if (ledgerFilter === 'week')  filtered = all.filter(e => e.date >= now - 7 * DAY);
  else if (ledgerFilter === 'month') filtered = all.filter(e => e.date >= now - 30 * DAY);
  filtered = filtered.sort((a, b) => b.date - a.date);

  const st = ledgerStats(filtered);
  const stAll = ledgerStats(all);
  const labels = { today: 'اليوم', week: '7 أيام', month: '30 يوم', all: 'الكل' };

  $('#viewRoot').innerHTML = `
    <div class="filter-bar" style="margin-bottom:12px">
      ${[['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['all','الكل']].map(([k, l]) =>
        `<button class="btn sm ${ledgerFilter === k ? 'primary' : 'ghost'}" onclick="ledgerFilter='${k}';renderLedger()">${l}</button>`
      ).join('')}
    </div>

    <div class="grid stats" style="margin-bottom:14px">
      <div class="stat g">
        <div class="lbl">إيرادات (${labels[ledgerFilter]})</div>
        <div class="val" style="color:var(--green)">${money(st.inc)}</div>
      </div>
      <div class="stat r">
        <div class="lbl">مصروفات</div>
        <div class="val" style="color:var(--red)">${money(st.exp)}</div>
      </div>
      <div class="stat ${st.net > 0 ? 'g' : st.net < 0 ? 'r' : 'a'}">
        <div class="lbl">${st.net > 0 ? 'ربح' : st.net < 0 ? 'خسارة' : 'الصافي'}</div>
        <div class="val" style="color:${st.net > 0 ? 'var(--green)' : st.net < 0 ? 'var(--red)' : 'var(--muted)'}">
          ${money(Math.abs(st.net))}
        </div>
      </div>
      <div class="stat">
        <div class="lbl">الصافي الكلي</div>
        <div class="val" style="color:${stAll.net > 0 ? 'var(--green)' : stAll.net < 0 ? 'var(--red)' : 'var(--muted)'}">
          ${money(Math.abs(stAll.net))}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        ${filtered.length ? `<table>
          <thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th><th></th></tr></thead>
          <tbody>
            ${filtered.map(e => `<tr>
              <td style="white-space:nowrap;font-size:12px">${fmtDate(e.date)}</td>
              <td><span class="pill ${e.type === 'income' ? 'inc' : 'exp'}">${e.type === 'income' ? 'إيراد' : 'مصروف'}</span></td>
              <td style="font-size:13px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.note || '—')}</td>
              <td class="amount ${e.type === 'income' ? 'neg' : 'pos'}">${e.type === 'income' ? '+' : '−'}${money(e.amount)}</td>
              <td><div class="actions">
                <button class="icon-btn" onclick="deleteLedger('${e.id}')">🗑️</button>
              </div></td>
            </tr>`).join('')}
          </tbody></table>` : `<div class="empty">
            <span class="e-ico">💹</span>لا حركات في هذه الفترة
            <br><br>
            <button class="btn success sm" onclick="openLedgerModal('income')">+ إيراد</button>
            <button class="btn danger sm" onclick="openLedgerModal('expense')">- مصروف</button>
          </div>`}
      </div>
    </div>`;
}

function openLedgerModal(type) {

function openItemModal(id) {
  const it = id ? state.data.items.find(x => x.id === id) : null;
  openModal({
    title: it ? 'تعديل مادة' : 'مادة جديدة',
    body: `
      <label>اسم المادة *</label>
      <input id="iName" value="${esc(it?.name || '')}" placeholder="مثال: أسمنت">
      <label>الوحدة</label>
      <input id="iUnit" value="${esc(it?.unit || '')}" placeholder="كيس / كرتون / قطعة">
      <label>سعر الوحدة (${cur()})</label>
      <input id="iPrice" type="number" step="0.01" min="0" value="${it?.price ?? ''}" placeholder="0.00" inputmode="decimal">
      <label>الكمية في المخزون</label>
      <input id="iStock" type="number" step="0.01" value="${it?.stock ?? 0}" placeholder="0" inputmode="decimal">`,
    onSubmit: form => {
      const name = $('#iName', form).value.trim();
      if (name.length < 2) { toast('اسم المادة قصير', 'err'); return false; }
      const payload = {
        name,
        unit: $('#iUnit', form).value.trim(),
        price: parseFloat($('#iPrice', form).value) || 0,
        stock: parseFloat($('#iStock', form).value) || 0
      };
      if (it) { Object.assign(it, payload); toast('تم التحديث'); }
      else { state.data.items.push({ id: uid(), ...payload, createdAt: Date.now() }); toast('تمت الإضافة'); }
      saveData(); renderItems();
    }
  });
}

function deleteItem(id) {
  openModal({
    title: 'حذف المادة',
    body: '<p>هل تريد حذف هذه المادة؟</p>',
    submitText: 'حذف', danger: true,
    onSubmit: () => {
      state.data.items = state.data.items.filter(x => x.id !== id);

}

function redeemCode(inputId) {
  const id = inputId || 'codeInput';
  const input = $('#' + id);
  const code = (input?.value || '').trim().toUpperCase();
  if (!code) return toast('أدخل الكود', 'err');

  const codes = STORE.get(K.codes, []);
  const found = codes.find(c => c.code === code);
  if (!found)     return toast('كود غير صالح', 'err');
  if (found.used) return toast('كود مستخدم مسبقاً', 'err');

  found.used = true;
  found.usedBy = state.user.id;
  found.usedAt = Date.now();
  STORE.set(K.codes, codes);

  extendSubscription(state.user.id, found.plan, found.days);
  toast('تم التفعيل بنجاح');
  setTimeout(() => location.reload(), 900);
}

function saveProfile() {
  const name = $('#sName').value.trim();
  const phone = $('#sPhone').value.trim();
  if (name.length < 2) return toast('الاسم قصير', 'err');
  const users = STORE.get(K.users, []);
  if (users.some(x => x.phone === phone && x.id !== state.user.id)) return toast('الرقم مستخدم', 'err');
  const u = users.find(x => x.id === state.user.id);
  u.name = name; u.phone = phone;
  STORE.set(K.users, users);
  state.user = u;
  updateSidebar();
  toast('تم الحفظ');
}

function changePass() {
  const oldP = $('#sOld').value, newP = $('#sNew').value;
  const users = STORE.get(K.users, []);
  const u = users.find(x => x.id === state.user.id);
  if (u.pass !== hash(oldP + 'ldg')) return toast('كلمة المرور الحالية خاطئة', 'err');
  if (newP.length < 4)               return toast('كلمة المرور الجديدة قصيرة', 'err');
  u.pass = hash(newP + 'ldg');
  STORE.set(K.users, users);
  toast('تم التغيير');
  $('#sOld').value = ''; $('#sNew').value = '';
}

function saveCurrency() {
  state.data.settings.currency = $('#sCur').value.trim() || 'ر.س';
  saveData(); toast('تم الحفظ');
}

function exportData() {
  const payload = {
    user: { name: state.user.name, phone: state.user.phone },
    data: state.data,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ledger-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('تم التصدير');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const json = JSON.parse(ev.target.result);
      if (!json.data) throw new Error();
      state.data = {
        customers: json.data.customers || [],
        transactions: json.data.transactions || [],
        ledger: json.data.ledger || [],
        items: json.data.items || [],
        settings: json.data.settings || { currency: 'ر.س' }
      };
      saveData();
      toast('تم الاستيراد');
      renderView();
    } catch { toast('ملف غير صالح', 'err'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function wipeData() {
  openModal({
    title: 'حذف كل البيانات',
    body: `<p style="line-height:1.8">سيتم حذف جميع العملاء والحركات والمواد نهائياً.<br>

      state.data = { customers: [], transactions: [], ledger: [], items: [], settings: { currency: 'ر.س' } };
      saveData(); toast('تم الحذف', 'err'); renderView();
    }
  });
}

function copyCode(code) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => toast('تم النسخ'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    toast('تم النسخ');
  }
}

    body: `<p style="line-height:1.8">حذف المستخدم <b>${esc(u.name)}</b> وجميع بياناته؟<br>

    submitText: 'حذف', danger: true,

function openCodeGen() {
  openModal({
    title: 'توليد أكواد',
    body: `
      <label>الخطة</label>
      <select id="genPlan">
        ${PLANS.map(p => `<option value="${p.id}">${p.name} — ${p.days} يوم — $${p.price}</option>`).join('')}
      </select>
      <label>عدد الأكواد</label>
      <input id="genCount" type="number" value="10" min="1" max="100" inputmode="numeric">`,
    submitText: 'توليد',
    onSubmit: form => {
      const planId = $('#genPlan', form).value;
      const count = Math.min(100, Math.max(1, parseInt($('#genCount', form).value) || 1));
      const p = planById(planId);
      const codes = STORE.get(K.codes, []);
      const newCodes = [];
      for (let i = 0; i < count; i++) {
        const r1 = Math.random().toString(36).slice(2, 6).toUpperCase();
        const r2 = Math.random().toString(36).slice(2, 6).toUpperCase();
        const code = `LED-${p.id.toUpperCase()}-${r1}${r2}`;
        codes.push({ code, plan: planId, days: p.days, used: false, createdAt: Date.now() });
        newCodes.push(code);
      }
      STORE.set(K.codes, codes);
      toast(`تم توليد ${count} كود`);
      renderAdmin();
    }
  });
}

function delCode(code) {
  openModal({
    title: 'حذف كود',
    body: `<p>حذف الكود <b style="direction:ltr;display:inline-block">${esc(code)}</b>؟</p>`,
    submitText: 'حذف', danger: true,
    onSubmit: () => {
      STORE.set(K.codes, STORE.get(K.codes, []).filter(c => c.code !== code));
      renderAdmin(); toast('تم الحذف', 'err');
    }
  });
}

function resetPresetCodes() {
  openModal({
    title: 'استعادة الأكواد الأصلية',
    body: `<p style="line-height:1.8">سيتم استبدال كل الأكواد بـ <b>100 كود جديد</b>.<br>
      الأكواد الحالية ستفقد حالتها.</p>`,
    submitText: 'استعادة', danger: true,
    onSubmit: () => {
      const now = Date.now();
      STORE.set(K.codes, PRESET_CODES.map((code, i) => {
        const plan = planFromCode(code);
        return { code, plan, days: planById(plan).days, used: false, createdAt: now - i * 1000 };
      }));
      renderAdmin(); toast('تم الاستعادة');
    }
  });
}

/* ═══════════════════════════════════════════════════════
   نظام النوافذ (Modals)
   ═══════════════════════════════════════════════════════ */
function closeAllModals() {
  $$('.overlay').forEach(o => o.remove());
}

function openModal({ title, body, submitText = 'حفظ', onSubmit, wide = false, danger = false, onMount }) {
  closeAllModals();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const hasSubmit = submitText !== null;
  ov.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>${title}</h3>
        <button type="button" class="icon-btn" data-close>×</button>
      </div>
      <form class="modal-body">
        ${body}
        <div class="modal-foot">
          <button type="button" class="btn ghost" data-close>${hasSubmit ? 'إلغاء' : 'إغلاق'}</button>
          ${hasSubmit ? `<button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${submitText}</button>` : ''}
        </div>
      </form>
    </div>`;
  document.body.appendChild(ov);

  const close = () => ov.remove();
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', close));
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });

  const form = $('form', ov);
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (onSubmit(form) !== false) close();
  });

  if (onMount) onMount(form);
  setTimeout(() => {
    const f = $('input:not([type="hidden"]),select,textarea', form);
    if (f) f.focus();
  }, 100);
  return close;
}
